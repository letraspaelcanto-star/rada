name: Test Docker Build

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: rada:pr-test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Rada: la imagen no puede llevar código enterprise de Chatwoot Inc.
      - name: Imagen sin enterprise/
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm --entrypoint sh rada:pr-test -c 'test ! -e /app/enterprise' \
            || { echo "::error::La imagen contiene /app/enterprise (código propietario de Chatwoot Inc.)"; exit 1; }
          docker run --rm --entrypoint sh rada:pr-test -c 'test -n "$DISABLE_ENTERPRISE"' \
            || { echo "::error::Falta DISABLE_ENTERPRISE en la imagen"; exit 1; }
          echo "OK: la imagen no tiene /app/enterprise y DISABLE_ENTERPRISE está seteado."
