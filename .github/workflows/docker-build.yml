name: Build y push de imagen

# Compila la imagen de producción y la publica en GitHub Container Registry.
# Las VMs (staging, producción agencia, instalaciones dedicadas de clientes)
# hacen PULL de esta imagen: nunca se buildea en producción.

on:
  push:
    tags:
      - 'v*'            # v4.18.0-agency.1, v4.19.0-agency.2, ...

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ej. tu-agencia/crm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags y labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUNDLE_WITHOUT=development:test
            RAILS_ENV=production
            RAILS_SERVE_STATIC_FILES=true
            EXECJS_RUNTIME=Node

  # ---------------------------------------------------------------
